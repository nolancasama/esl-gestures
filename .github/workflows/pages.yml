name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer push win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: `node --test "src/**/*.test.mjs"` needs node's own glob
          # expansion, which Node 20 lacks.
          node-version: 22
      - run: npm ci
      - run: npm test
      # Pages serves the site under /esl-gestures/; the pose detector resolves
      # its WASM and model files from Vite's BASE_URL, so the base must match.
      - run: npm run build -- --base=/esl-gestures/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
